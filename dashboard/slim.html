<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Minions — Slim UX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* ---------------------------------------------------------------
       Slim UX prototype — gated by the 'slim-ux' feature flag.
       Plain HTML/CSS/vanilla JS so the human can edit this file
       directly. The dashboard reads this from disk on each request,
       so a page refresh shows the latest edit (no server restart).
       --------------------------------------------------------------- */
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1c2128;
      --border: #30363d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --blue: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
      --radius: 6px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }

    /* ── Top bar ──────────────────────────────────────────────── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      height: 40px;
      flex-shrink: 0;
    }
    .topbar-title {
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
      letter-spacing: 0.3px;
    }
    .topbar-title .badge {
      display: inline-block;
      margin-left: 8px;
      padding: 1px 6px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--blue);
      border: 1px solid var(--blue);
      border-radius: 3px;
      vertical-align: 2px;
    }
    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      padding: 4px 8px;
      border-radius: var(--radius);
    }
    .icon-btn:hover { color: var(--text); background: var(--surface2); }

    /* ── Layout grid: chatbox | history (right, full height); status under chatbox ── */
    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      grid-template-rows: 1fr 220px;
      grid-template-areas:
        "chat history"
        "status history";
      gap: 8px;
      padding: 8px;
      height: calc(100vh - 40px);
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
    }
    .panel-header {
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      min-height: 0;
    }
    .panel-placeholder {
      color: var(--muted);
      font-style: italic;
      font-size: 12px;
    }

    .panel-chat    { grid-area: chat; }
    .panel-status  { grid-area: status; }
    .panel-history { grid-area: history; }

    /* ── Chatbox ─────────────────────────────────────────────── */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }
    .chat-empty {
      color: var(--muted);
      font-size: 12px;
      font-style: italic;
      text-align: center;
      margin-top: 24px;
    }
    .chat-msg {
      max-width: 90%;
      padding: 8px 12px;
      border-radius: var(--radius);
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 13px;
    }
    .chat-msg.user {
      align-self: flex-end;
      background: var(--blue);
      color: #fff;
    }
    .chat-msg.assistant {
      align-self: flex-start;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .chat-msg.system {
      align-self: center;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-style: italic;
    }
    .chat-msg.error {
      align-self: flex-start;
      background: rgba(248, 81, 73, 0.1);
      color: var(--red);
      border: 1px solid var(--red);
      font-size: 12px;
    }
    .chat-input-wrap {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--surface);
    }
    .chat-input {
      flex: 1;
      padding: 8px 10px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      font-family: inherit;
      resize: none;
      min-height: 36px;
      max-height: 120px;
    }
    .chat-input:focus { outline: none; border-color: var(--blue); }
    .chat-send {
      padding: 8px 16px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-end;
    }
    .chat-send:hover { filter: brightness(1.1); }
    .chat-send:disabled { opacity: 0.5; cursor: not-allowed; }
    .chat-stop {
      padding: 8px 12px;
      background: var(--surface2);
      color: var(--red);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 11px;
      cursor: pointer;
      align-self: flex-end;
      display: none;
    }
    .chat-stop:hover { filter: brightness(1.1); }

    /* Tool-call progress lines rendered above the streaming assistant
       bubble — mirrors the dim monospace look of the existing CC. */
    .chat-tools {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 4px;
    }
    .chat-tool {
      color: var(--muted);
      font-size: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-tool::before { content: "● "; }

    .chat-thinking {
      color: var(--muted);
      font-size: 11px;
      font-style: italic;
    }
    .chat-thinking-dots {
      display: inline-flex;
      gap: 3px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .chat-thinking-dots > span {
      width: 4px;
      height: 4px;
      background: var(--blue);
      border-radius: 50%;
      animation: dotPulse 1.2s infinite;
    }
    .chat-thinking-dots > span:nth-child(2) { animation-delay: 0.2s; }
    .chat-thinking-dots > span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotPulse {
      0%, 80%, 100% { opacity: 0.3; }
      40%           { opacity: 1; }
    }

    /* Per-action status row (CC ===ACTIONS=== executed by the server) */
    .chat-action {
      align-self: flex-start;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 10px;
      border: 1px dashed var(--border);
      color: var(--muted);
    }
    .chat-action.ok    { color: var(--green); }
    .chat-action.warn  { color: #d29922; }
    .chat-action.err   { color: var(--red); }

    /* Lightweight markdown styling inside assistant bubbles. */
    .chat-msg.assistant code,
    .chat-msg.assistant pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .chat-msg.assistant code {
      background: var(--bg);
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 0.9em;
    }
    .chat-msg.assistant pre {
      background: var(--bg);
      padding: 8px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 11px;
      margin: 4px 0;
    }
    .chat-msg.assistant pre code { background: none; padding: 0; }
    .chat-msg.assistant a { color: var(--blue); }
    .chat-msg.assistant strong { color: var(--text); }

    /* ── Settings dialog ─────────────────────────────────────── */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 460px;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 64px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h3 { margin: 0; font-size: 14px; color: var(--blue); }
    .modal-body { padding: 12px 16px; overflow-y: auto; }
    .modal-body p { color: var(--muted); margin: 4px 0 12px; font-size: 12px; }
    .flag-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .flag-row:last-child { border-bottom: none; }
    .flag-name { font-size: 12px; font-weight: 600; }
    .flag-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .flag-toggle { display: flex; align-items: center; gap: 6px; }
    .flag-toggle input { cursor: pointer; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">Minions <span class="badge">SLIM UX</span></div>
  <div class="topbar-actions">
    <button class="icon-btn" title="New chat (clears session)" onclick="slimChatNew()">&#x270E;</button>
    <button class="icon-btn" title="Settings" onclick="openSlimSettings()">&#9881;</button>
  </div>
</div>

<div class="layout">
  <div class="panel panel-chat">
    <div class="panel-header">Chatbox</div>
    <div class="chat-messages" id="chat-messages">
      <div class="chat-empty">No messages yet — say hi to Command Center.</div>
    </div>
    <div class="chat-input-wrap">
      <textarea
        id="chat-input"
        class="chat-input"
        rows="1"
        placeholder="Ask anything or give a command... (Enter to send, Shift+Enter for newline)"
      ></textarea>
      <button id="chat-stop" class="chat-stop" type="button" title="Stop the in-flight response">Stop</button>
      <button id="chat-send" class="chat-send" type="button">Send</button>
    </div>
  </div>

  <div class="panel panel-status">
    <div class="panel-header">Status</div>
    <div class="panel-body">
      <div class="panel-placeholder">Status — coming soon.</div>
    </div>
  </div>

  <div class="panel panel-history">
    <div class="panel-header">History</div>
    <div class="panel-body">
      <div class="panel-placeholder">History — coming soon.</div>
    </div>
  </div>
</div>

<!-- Minimal settings dialog: lists experimental flags so the user can
     flip 'slim-ux' off and revert to the original dashboard. Reuses
     the same /api/features/toggle endpoint as the full dashboard. -->
<div class="modal-bg" id="slim-settings-modal" onclick="if(event.target===this)closeSlimSettings()">
  <div class="modal">
    <div class="modal-header">
      <h3>Settings &middot; Experimental flags</h3>
      <button class="icon-btn" title="Close" onclick="closeSlimSettings()">&times;</button>
    </div>
    <div class="modal-body" id="slim-settings-body">
      <p>Loading flags&hellip;</p>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ── Settings dialog ───────────────────────────────────────────
  function escHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  async function openSlimSettings() {
    var modal = document.getElementById('slim-settings-modal');
    var body = document.getElementById('slim-settings-body');
    body.innerHTML = '<p>Loading flags&hellip;</p>';
    modal.classList.add('open');
    try {
      var res = await fetch('/api/features');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      var flags = (data && data.features) || [];
      if (flags.length === 0) {
        body.innerHTML = '<p>No experimental flags registered.</p>';
        return;
      }
      var rows = flags.map(function(f) {
        return (
          '<div class="flag-row">' +
            '<div>' +
              '<div class="flag-name">' + escHtml(f.id) + '</div>' +
              '<div class="flag-desc">' + escHtml(f.description || '') + '</div>' +
            '</div>' +
            '<label class="flag-toggle">' +
              '<input type="checkbox" data-flag="' + escHtml(f.id) + '"' +
                (f.enabled ? ' checked' : '') + '>' +
              '<span>' + (f.enabled ? 'On' : 'Off') + '</span>' +
            '</label>' +
          '</div>'
        );
      }).join('');
      body.innerHTML =
        '<p>Toggle <code>slim-ux</code> off to return to the original dashboard.</p>' +
        rows;
      var inputs = body.querySelectorAll('input[type=checkbox][data-flag]');
      for (var i = 0; i < inputs.length; i++) {
        inputs[i].addEventListener('change', onFlagToggle);
      }
    } catch (e) {
      body.innerHTML = '<p style="color:var(--red)">Failed to load flags: ' + escHtml(e.message) + '</p>';
    }
  }
  window.openSlimSettings = openSlimSettings;

  function closeSlimSettings() {
    document.getElementById('slim-settings-modal').classList.remove('open');
  }
  window.closeSlimSettings = closeSlimSettings;

  async function onFlagToggle(ev) {
    var input = ev.currentTarget;
    var id = input.getAttribute('data-flag');
    var enabled = input.checked;
    var label = input.parentElement.querySelector('span');
    if (label) label.textContent = enabled ? 'On' : 'Off';
    try {
      var res = await fetch('/api/features/toggle', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: id, enabled: enabled }),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      // If the user just turned slim-ux off, reload to drop back to the
      // original dashboard immediately.
      if (id === 'slim-ux' && !enabled) {
        location.reload();
      }
    } catch (e) {
      input.checked = !enabled;
      if (label) label.textContent = !enabled ? 'On' : 'Off';
      alert('Toggle failed: ' + e.message);
    }
  }

  // ── Chatbox wired to /api/command-center/stream ──────────────
  // Mirrors the full dashboard's command center: SSE streaming, tool-call
  // progress, abort, and per-tab session continuity. Persists sessionId +
  // recent message history in localStorage so reloads thread into the same
  // server session. Multi-tab UI from the full dashboard is intentionally
  // out of scope — slim is a single conversation per browser tab.

  var SLIM_STORAGE_KEY = 'slim-cc-state-v1';
  var SLIM_TAB_KEY     = 'slim-cc-tabid-v1';
  var SLIM_MAX_MESSAGES = 30;
  var STREAM_TIMEOUT_MS = (60 * 60 * 1000) + 60000;

  var sessionId = null;       // server-issued session id (carries history)
  var messages = [];          // [{ role, text }] for persistence + redraw
  var sending = false;
  var abortController = null;

  // Stable per-browser-tab id so /api/command-center/abort and the
  // server-side cc-sessions.json bookkeeping target this tab specifically.
  var tabId = (function() {
    try {
      var t = sessionStorage.getItem(SLIM_TAB_KEY);
      if (t) return t;
      t = 'slim-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      sessionStorage.setItem(SLIM_TAB_KEY, t);
      return t;
    } catch (_e) {
      return 'slim-' + Date.now().toString(36);
    }
  })();

  var msgsEl  = document.getElementById('chat-messages');
  var inputEl = document.getElementById('chat-input');
  var sendBtn = document.getElementById('chat-send');
  var stopBtn = document.getElementById('chat-stop');

  // ── Persistence ──────────────────────────────────────────────
  function loadState() {
    try {
      var raw = localStorage.getItem(SLIM_STORAGE_KEY);
      if (!raw) return;
      var data = JSON.parse(raw) || {};
      sessionId = data.sessionId || null;
      messages = Array.isArray(data.messages) ? data.messages.slice(-SLIM_MAX_MESSAGES) : [];
    } catch (_e) { /* ignore */ }
  }
  var saveDebounce = null;
  function saveState() {
    if (saveDebounce) return;
    saveDebounce = setTimeout(function() {
      saveDebounce = null;
      try {
        localStorage.setItem(SLIM_STORAGE_KEY, JSON.stringify({
          sessionId: sessionId,
          messages: messages.slice(-SLIM_MAX_MESSAGES),
        }));
      } catch (_e) { /* localStorage might be full */ }
    }, 300);
  }

  // ── Minimal markdown renderer (bold, italic, code, code-fence,
  // links). Keeps slim self-contained — no need to pull in renderMd. ──
  function escHtmlChat(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  function renderMarkdown(text) {
    if (!text) return '';
    var html = escHtmlChat(text);
    // Code fences first (before other inline transforms can mangle them).
    var codeSlots = [];
    html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, function(_, _lang, code) {
      codeSlots.push('<pre><code>' + code + '</code></pre>');
      return '␀CB' + (codeSlots.length - 1) + '␀';
    });
    // Inline code.
    html = html.replace(/`([^`\n]+)`/g, function(_, code) {
      codeSlots.push('<code>' + code + '</code>');
      return '␀CB' + (codeSlots.length - 1) + '␀';
    });
    // Bold / italic.
    html = html.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>');
    // Links: [text](url) — only http/https/mailto allowed.
    html = html.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(_, label, href) {
      if (!/^(https?:|mailto:|\/)/i.test(href)) return label;
      return '<a href="' + href + '" target="_blank" rel="noopener">' + label + '</a>';
    });
    // Restore code slots.
    html = html.replace(/␀CB(\d+)␀/g, function(_, i) { return codeSlots[+i] || ''; });
    return html;
  }

  // ── Render helpers ───────────────────────────────────────────
  function clearEmpty() {
    var empty = msgsEl.querySelector('.chat-empty');
    if (empty) empty.remove();
  }
  function scrollToBottom() {
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }
  function appendBubble(role, text) {
    clearEmpty();
    var div = document.createElement('div');
    div.className = 'chat-msg ' + role;
    if (role === 'assistant') div.innerHTML = renderMarkdown(text);
    else div.textContent = text;
    msgsEl.appendChild(div);
    scrollToBottom();
    return div;
  }
  function appendActionStatus(severity, label) {
    var div = document.createElement('div');
    div.className = 'chat-action ' + (severity || '');
    div.textContent = label;
    msgsEl.appendChild(div);
    scrollToBottom();
    return div;
  }

  // Format a tool-use input the same way the full dashboard does for the
  // dim "● Reading foo.js" / "$ git status" progress lines.
  function formatToolSummary(name, input) {
    var inp = input || {};
    switch (name) {
      case 'Bash': {
        var cmd = String(inp.command || '');
        if (cmd.length > 80) cmd = cmd.slice(0, 77) + '...';
        return '$ ' + cmd;
      }
      case 'Read':  return 'Reading ' + (inp.file_path || '');
      case 'Edit':  return 'Editing ' + (inp.file_path || '');
      case 'Write': return 'Writing ' + (inp.file_path || '');
      case 'Grep':  return 'Searching `' + (inp.pattern || '') + '` in ' + (inp.path || '.');
      case 'Glob':  return 'Glob ' + (inp.pattern || '');
      case 'WebFetch':  return 'Fetch ' + (inp.url || '');
      case 'WebSearch': return 'Search "' + (inp.query || '') + '"';
      case 'TodoWrite': {
        var items = Array.isArray(inp.todos) ? inp.todos : [];
        return 'Update todos (' + items.length + ' items)';
      }
      default: {
        var keys = Object.keys(inp);
        if (keys.length === 0) return name + '()';
        var v = String(inp[keys[0]] || '');
        if (v.length > 40) v = v.slice(0, 37) + '...';
        return name + '(' + keys[0] + ': ' + v + ')';
      }
    }
  }

  // ── Streaming bubble: holds tool-progress lines + live text + thinking
  function buildStreamBubble() {
    clearEmpty();
    var div = document.createElement('div');
    div.className = 'chat-msg assistant streaming';

    var tools = document.createElement('div');
    tools.className = 'chat-tools';
    div.appendChild(tools);

    var body = document.createElement('div');
    body.className = 'chat-body';
    div.appendChild(body);

    var thinking = document.createElement('div');
    thinking.className = 'chat-thinking';
    thinking.innerHTML = 'Thinking<span class="chat-thinking-dots"><span></span><span></span><span></span></span>';
    div.appendChild(thinking);

    msgsEl.appendChild(div);
    scrollToBottom();

    return {
      root: div,
      tools: tools,
      body: body,
      thinking: thinking,
      addTool: function(name, input) {
        var line = document.createElement('div');
        line.className = 'chat-tool';
        line.textContent = formatToolSummary(name, input);
        tools.appendChild(line);
        scrollToBottom();
      },
      setText: function(text) {
        body.innerHTML = renderMarkdown(text || '');
        scrollToBottom();
      },
      removeThinking: function() {
        if (thinking && thinking.parentNode) thinking.parentNode.removeChild(thinking);
      },
      finalize: function(text) {
        // Convert from streaming to a normal assistant bubble.
        if (thinking && thinking.parentNode) thinking.parentNode.removeChild(thinking);
        body.innerHTML = renderMarkdown(text || '');
        div.classList.remove('streaming');
        scrollToBottom();
      },
      replaceWithError: function(message) {
        if (thinking && thinking.parentNode) thinking.parentNode.removeChild(thinking);
        div.className = 'chat-msg error';
        div.innerHTML = '';
        div.textContent = message;
        scrollToBottom();
      },
    };
  }

  function setSending(on) {
    sending = on;
    sendBtn.disabled = on;
    sendBtn.textContent = on ? 'Sending…' : 'Send';
    stopBtn.style.display = on ? 'block' : 'none';
    inputEl.disabled = on;
  }

  // Restore previously rendered conversation on initial load.
  function rerenderHistory() {
    msgsEl.innerHTML = '';
    if (!messages.length) {
      var empty = document.createElement('div');
      empty.className = 'chat-empty';
      empty.textContent = 'No messages yet — say hi to Command Center.';
      msgsEl.appendChild(empty);
      return;
    }
    for (var i = 0; i < messages.length; i++) {
      var m = messages[i];
      if (m.role === 'action') appendActionStatus(m.severity || '', m.text || '');
      else appendBubble(m.role, m.text || '');
    }
  }
  loadState();
  rerenderHistory();

  // ── Action result formatting (mirrors CC's per-action status pills) ──
  function describeAction(action) {
    if (!action || !action.type) return 'action';
    var t = action.type;
    var label = action.title || action.id || action.file || action.agent || '';
    return label ? t + ': ' + label : t;
  }
  function renderActionResults(actions, results) {
    if (!actions || !actions.length) return;
    for (var i = 0; i < actions.length; i++) {
      var action = actions[i];
      var r = (results && results[i]) || null;
      var label = describeAction(action);
      var severity = 'ok';
      var symbol = '✓';
      var detail = '';
      if (r && r.error) { severity = 'err'; symbol = '✗'; detail = ' — ' + r.error; }
      else if (r && r.warning) { severity = 'warn'; symbol = 'ℹ'; detail = ' — ' + r.warning; }
      else if (r && r.duplicate) { severity = 'warn'; symbol = '↺'; detail = ' (already exists)'; }
      var text = symbol + ' ' + label + detail;
      appendActionStatus(severity, text);
      messages.push({ role: 'action', severity: severity, text: text });
    }
    saveState();
  }

  // ── Send / stream / abort ────────────────────────────────────
  async function sendMessage() {
    if (sending) return;
    var text = inputEl.value.trim();
    if (!text) return;

    appendBubble('user', text);
    messages.push({ role: 'user', text: text });
    saveState();

    inputEl.value = '';
    inputEl.style.height = 'auto';
    setSending(true);

    var stream = buildStreamBubble();
    var streamedText = '';
    abortController = new AbortController();
    var userAborted = false;
    var timeoutSignal = null;
    try { timeoutSignal = AbortSignal.timeout(STREAM_TIMEOUT_MS); } catch (_e) { /* old browsers */ }
    var signal = timeoutSignal && AbortSignal.any
      ? AbortSignal.any([abortController.signal, timeoutSignal])
      : abortController.signal;

    try {
      var res = await fetch('/api/command-center/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, tabId: tabId, sessionId: sessionId }),
        signal: signal,
      });
      if (!res.ok) {
        var errBody = await res.text().catch(function() { return ''; });
        throw new Error('HTTP ' + res.status + (errBody ? ': ' + errBody.slice(0, 200) : ''));
      }
      if (!res.body || !res.body.getReader) {
        throw new Error('Streaming not supported by this browser.');
      }

      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buf = '';
      var doneEvt = null;
      var errorEvt = null;

      while (true) {
        var r = await reader.read();
        if (r.done) break;
        buf += decoder.decode(r.value, { stream: true });
        var lines = buf.split('\n');
        buf = lines.pop();
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          if (!line.startsWith('data: ')) continue;
          var evt;
          try { evt = JSON.parse(line.slice(6)); } catch (_e) { continue; }
          if (evt.type === 'chunk') {
            streamedText += (evt.text || '');
            stream.setText(streamedText);
          } else if (evt.type === 'tool') {
            stream.addTool(evt.name, evt.input || {});
          } else if (evt.type === 'heartbeat') {
            /* server keep-alive — ignored on purpose */
          } else if (evt.type === 'done') {
            doneEvt = evt;
          } else if (evt.type === 'error') {
            errorEvt = evt;
          }
        }
      }

      if (errorEvt) {
        stream.replaceWithError(errorEvt.error || 'Error');
        messages.push({ role: 'error', text: errorEvt.error || 'Error' });
        saveState();
        return;
      }

      if (doneEvt) {
        var finalText = (doneEvt.text != null && doneEvt.text !== '') ? doneEvt.text : streamedText;
        stream.finalize(finalText || '(no response)');
        messages.push({ role: 'assistant', text: finalText || '(no response)' });
        if (doneEvt.sessionId !== undefined) sessionId = doneEvt.sessionId || null;
        saveState();
        if (doneEvt.actionParseError) {
          var pe = '⚠️ Actions block emitted but JSON could not be parsed — no actions executed.';
          appendActionStatus('err', pe);
          messages.push({ role: 'action', severity: 'err', text: pe });
          saveState();
        }
        if (doneEvt.actions && doneEvt.actions.length > 0) {
          renderActionResults(doneEvt.actions, doneEvt.actionResults || []);
        }
      } else {
        // No terminal event seen — stream ended early.
        stream.finalize(streamedText || '(stream ended before completion)');
        messages.push({ role: 'assistant', text: streamedText || '(stream ended before completion)' });
        saveState();
      }
    } catch (e) {
      if (e && (e.name === 'AbortError' || /aborted/i.test(String(e.message || '')))) {
        userAborted = true;
        if (streamedText) {
          stream.finalize(streamedText);
          messages.push({ role: 'assistant', text: streamedText });
        } else {
          stream.replaceWithError('Stopped.');
          messages.push({ role: 'error', text: 'Stopped.' });
        }
        saveState();
      } else {
        var msg = 'Send failed: ' + (e && e.message ? e.message : e);
        stream.replaceWithError(msg);
        messages.push({ role: 'error', text: msg });
        saveState();
      }
    } finally {
      setSending(false);
      abortController = null;
      if (!userAborted) inputEl.focus();
    }
  }

  function abortInFlight() {
    if (!sending || !abortController) return;
    // Tell the server to drop the live stream for our tab; ignore failures
    // (the AbortController also closes the local fetch).
    try {
      fetch('/api/command-center/abort', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tabId: tabId }),
      }).catch(function() {});
    } catch (_e) { /* ignore */ }
    try { abortController.abort(); } catch (_e) { /* ignore */ }
  }

  async function slimChatNew() {
    if (sending) abortInFlight();
    sessionId = null;
    messages = [];
    saveState();
    rerenderHistory();
    // Best-effort: ask the server to drop our tab session so the next
    // message starts a fresh conversation server-side too.
    try {
      fetch('/api/cc-sessions/' + encodeURIComponent(tabId), { method: 'DELETE' }).catch(function() {});
    } catch (_e) { /* ignore */ }
    inputEl.focus();
  }
  window.slimChatNew = slimChatNew;

  sendBtn.addEventListener('click', sendMessage);
  stopBtn.addEventListener('click', abortInFlight);
  inputEl.addEventListener('keydown', function(ev) {
    if (ev.key === 'Enter' && !ev.shiftKey) {
      ev.preventDefault();
      sendMessage();
    }
  });

  // Auto-grow the textarea up to its max-height.
  inputEl.addEventListener('input', function() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  inputEl.focus();
})();
</script>
</body>
</html>
