<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Minions — Slim UX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* ---------------------------------------------------------------
       Slim UX prototype — gated by the 'slim-ux' feature flag.
       Plain HTML/CSS/vanilla JS so the human can edit this file
       directly. The dashboard reads this from disk on each request,
       so a page refresh shows the latest edit (no server restart).
       --------------------------------------------------------------- */
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1c2128;
      --border: #30363d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --blue: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
      --radius: 6px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }

    /* ── Top bar ──────────────────────────────────────────────── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      height: 40px;
      flex-shrink: 0;
    }
    .topbar-title {
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
      letter-spacing: 0.3px;
    }
    .topbar-title .badge {
      display: inline-block;
      margin-left: 8px;
      padding: 1px 6px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--blue);
      border: 1px solid var(--blue);
      border-radius: 3px;
      vertical-align: 2px;
    }
    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      padding: 4px 8px;
      border-radius: var(--radius);
    }
    .icon-btn:hover { color: var(--text); background: var(--surface2); }

    /* ── Layout grid: chatbox | history (right, full height); status under chatbox ── */
    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      grid-template-rows: 1fr 220px;
      grid-template-areas:
        "chat history"
        "status history";
      gap: 8px;
      padding: 8px;
      height: calc(100vh - 40px);
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
    }
    .panel-header {
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      min-height: 0;
    }
    .panel-placeholder {
      color: var(--muted);
      font-style: italic;
      font-size: 12px;
    }

    .panel-chat    { grid-area: chat; }
    .panel-status  { grid-area: status; }
    .panel-history { grid-area: history; }

    /* ── Chatbox ─────────────────────────────────────────────── */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }
    .chat-empty {
      color: var(--muted);
      font-size: 12px;
      font-style: italic;
      text-align: center;
      margin-top: 24px;
    }
    .chat-msg {
      max-width: 90%;
      padding: 8px 12px;
      border-radius: var(--radius);
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 13px;
    }
    .chat-msg.user {
      align-self: flex-end;
      background: var(--blue);
      color: #fff;
    }
    .chat-msg.assistant {
      align-self: flex-start;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .chat-msg.system {
      align-self: center;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-style: italic;
    }
    .chat-msg.error {
      align-self: flex-start;
      background: rgba(248, 81, 73, 0.1);
      color: var(--red);
      border: 1px solid var(--red);
      font-size: 12px;
    }
    .chat-input-wrap {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--surface);
    }
    .chat-input {
      flex: 1;
      padding: 8px 10px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      font-family: inherit;
      resize: none;
      min-height: 36px;
      max-height: 120px;
    }
    .chat-input:focus { outline: none; border-color: var(--blue); }
    .chat-send {
      padding: 8px 16px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-end;
    }
    .chat-send:hover { filter: brightness(1.1); }
    .chat-send:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Settings dialog ─────────────────────────────────────── */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 460px;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 64px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h3 { margin: 0; font-size: 14px; color: var(--blue); }
    .modal-body { padding: 12px 16px; overflow-y: auto; }
    .modal-body p { color: var(--muted); margin: 4px 0 12px; font-size: 12px; }
    .flag-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .flag-row:last-child { border-bottom: none; }
    .flag-name { font-size: 12px; font-weight: 600; }
    .flag-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .flag-toggle { display: flex; align-items: center; gap: 6px; }
    .flag-toggle input { cursor: pointer; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">Minions <span class="badge">SLIM UX</span></div>
  <div class="topbar-actions">
    <button class="icon-btn" title="Settings" onclick="openSlimSettings()">&#9881;</button>
  </div>
</div>

<div class="layout">
  <div class="panel panel-chat">
    <div class="panel-header">Chatbox</div>
    <div class="chat-messages" id="chat-messages">
      <div class="chat-empty">No messages yet — say hi to Command Center.</div>
    </div>
    <div class="chat-input-wrap">
      <textarea
        id="chat-input"
        class="chat-input"
        rows="1"
        placeholder="Ask anything or give a command... (Enter to send, Shift+Enter for newline)"
      ></textarea>
      <button id="chat-send" class="chat-send" type="button">Send</button>
    </div>
  </div>

  <div class="panel panel-status">
    <div class="panel-header">Status</div>
    <div class="panel-body">
      <div class="panel-placeholder">Status — coming soon.</div>
    </div>
  </div>

  <div class="panel panel-history">
    <div class="panel-header">History</div>
    <div class="panel-body">
      <div class="panel-placeholder">History — coming soon.</div>
    </div>
  </div>
</div>

<!-- Minimal settings dialog: lists experimental flags so the user can
     flip 'slim-ux' off and revert to the original dashboard. Reuses
     the same /api/features/toggle endpoint as the full dashboard. -->
<div class="modal-bg" id="slim-settings-modal" onclick="if(event.target===this)closeSlimSettings()">
  <div class="modal">
    <div class="modal-header">
      <h3>Settings &middot; Experimental flags</h3>
      <button class="icon-btn" title="Close" onclick="closeSlimSettings()">&times;</button>
    </div>
    <div class="modal-body" id="slim-settings-body">
      <p>Loading flags&hellip;</p>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ── Settings dialog ───────────────────────────────────────────
  function escHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  async function openSlimSettings() {
    var modal = document.getElementById('slim-settings-modal');
    var body = document.getElementById('slim-settings-body');
    body.innerHTML = '<p>Loading flags&hellip;</p>';
    modal.classList.add('open');
    try {
      var res = await fetch('/api/features');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      var flags = (data && data.features) || [];
      if (flags.length === 0) {
        body.innerHTML = '<p>No experimental flags registered.</p>';
        return;
      }
      var rows = flags.map(function(f) {
        return (
          '<div class="flag-row">' +
            '<div>' +
              '<div class="flag-name">' + escHtml(f.id) + '</div>' +
              '<div class="flag-desc">' + escHtml(f.description || '') + '</div>' +
            '</div>' +
            '<label class="flag-toggle">' +
              '<input type="checkbox" data-flag="' + escHtml(f.id) + '"' +
                (f.enabled ? ' checked' : '') + '>' +
              '<span>' + (f.enabled ? 'On' : 'Off') + '</span>' +
            '</label>' +
          '</div>'
        );
      }).join('');
      body.innerHTML =
        '<p>Toggle <code>slim-ux</code> off to return to the original dashboard.</p>' +
        rows;
      var inputs = body.querySelectorAll('input[type=checkbox][data-flag]');
      for (var i = 0; i < inputs.length; i++) {
        inputs[i].addEventListener('change', onFlagToggle);
      }
    } catch (e) {
      body.innerHTML = '<p style="color:var(--red)">Failed to load flags: ' + escHtml(e.message) + '</p>';
    }
  }
  window.openSlimSettings = openSlimSettings;

  function closeSlimSettings() {
    document.getElementById('slim-settings-modal').classList.remove('open');
  }
  window.closeSlimSettings = closeSlimSettings;

  async function onFlagToggle(ev) {
    var input = ev.currentTarget;
    var id = input.getAttribute('data-flag');
    var enabled = input.checked;
    var label = input.parentElement.querySelector('span');
    if (label) label.textContent = enabled ? 'On' : 'Off';
    try {
      var res = await fetch('/api/features/toggle', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: id, enabled: enabled }),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      // If the user just turned slim-ux off, reload to drop back to the
      // original dashboard immediately.
      if (id === 'slim-ux' && !enabled) {
        location.reload();
      }
    } catch (e) {
      input.checked = !enabled;
      if (label) label.textContent = !enabled ? 'On' : 'Off';
      alert('Toggle failed: ' + e.message);
    }
  }

  // ── Chatbox wired to /api/command-center/stream ──────────────
  var sessionId = null;     // server returns one on first reply, send back to keep session
  var sending = false;
  var msgsEl = document.getElementById('chat-messages');
  var inputEl = document.getElementById('chat-input');
  var sendBtn = document.getElementById('chat-send');

  function clearEmpty() {
    var empty = msgsEl.querySelector('.chat-empty');
    if (empty) empty.remove();
  }

  function addMsg(role, text) {
    clearEmpty();
    var div = document.createElement('div');
    div.className = 'chat-msg ' + role;
    div.textContent = text;
    msgsEl.appendChild(div);
    msgsEl.scrollTop = msgsEl.scrollHeight;
    return div;
  }

  function setSending(on) {
    sending = on;
    sendBtn.disabled = on;
    sendBtn.textContent = on ? 'Sending…' : 'Send';
  }

  async function sendMessage() {
    if (sending) return;
    var text = inputEl.value.trim();
    if (!text) return;
    addMsg('user', text);
    inputEl.value = '';
    setSending(true);

    var streamingDiv = addMsg('assistant', '');
    var streamedText = '';

    try {
      var res = await fetch('/api/command-center/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, sessionId: sessionId }),
      });
      if (!res.ok) {
        var errBody = await res.text().catch(function() { return ''; });
        throw new Error('HTTP ' + res.status + (errBody ? ': ' + errBody.slice(0, 200) : ''));
      }
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buf = '';
      while (true) {
        var r = await reader.read();
        if (r.done) break;
        buf += decoder.decode(r.value, { stream: true });
        var lines = buf.split('\n');
        buf = lines.pop();
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          if (!line.startsWith('data: ')) continue;
          var evt;
          try { evt = JSON.parse(line.slice(6)); } catch (_e) { continue; }
          if (evt.type === 'chunk') {
            streamedText += (evt.text || '');
            streamingDiv.textContent = streamedText;
            msgsEl.scrollTop = msgsEl.scrollHeight;
          } else if (evt.type === 'done') {
            if (evt.text) streamedText = evt.text; // server-side cleaned text wins
            streamingDiv.textContent = streamedText || '(no response)';
            if (evt.sessionId !== undefined) sessionId = evt.sessionId || null;
          } else if (evt.type === 'error') {
            streamingDiv.className = 'chat-msg error';
            streamingDiv.textContent = evt.error || 'Error';
          }
          // Other event types (heartbeat, tool, etc.) ignored for now.
        }
      }
    } catch (e) {
      streamingDiv.className = 'chat-msg error';
      streamingDiv.textContent = 'Send failed: ' + e.message;
    } finally {
      setSending(false);
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', function(ev) {
    if (ev.key === 'Enter' && !ev.shiftKey) {
      ev.preventDefault();
      sendMessage();
    }
  });

  // Auto-grow the textarea up to its max-height.
  inputEl.addEventListener('input', function() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  inputEl.focus();
})();
</script>
</body>
</html>
